[package]
name = "hoi4skill"
version = "0.30.3"
edition = "2021"
license = "GPL-3.0-only"
description = "Rust CLI backend for the hoi4-mod-maker Codex skill."

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 8
incremental = true

[dependencies]
bincode = { version = "2", features = ["serde"] }
calamine = "0.35.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
